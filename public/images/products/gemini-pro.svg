<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="geminiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020611"/>
      <stop offset="50%" stop-color="#09142e"/>
      <stop offset="100%" stop-color="#14092b"/>
    </linearGradient>
    <linearGradient id="geminiStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E82EE"/>
      <stop offset="30%" stop-color="#7B5EE8"/>
      <stop offset="70%" stop-color="#DE4396"/>
      <stop offset="100%" stop-color="#F78248"/>
    </linearGradient>
    <radialGradient id="geminiGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7B5EE8" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#09142e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#geminiBg)"/>
  <circle cx="400" cy="165" r="280" fill="url(#geminiGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Official Google Gemini 4-Pointed Sparkle Star -->
  <g transform="translate(400, 160) scale(1.35)">
    <path d="M 0,-85 C 0,-15 15,0 85,0 C 15,0 0,15 0,85 C 0,15 -15,0 -85,0 C -15,0 0,-15 0,-85 Z" fill="url(#geminiStar)" filter="drop-shadow(0 0 25px rgba(123,94,232,0.65))"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Orbiting accent sparkles -->
  <g fill="#4E82EE" opacity="0.75">
    <path transform="translate(225, 120) scale(0.35)" d="M 0,-40 C 0,-8 8,0 40,0 C 8,0 0,8 0,40 C 0,8 -8,0 -40,0 C -8,0 0,-8 0,-40 Z"/>
    <path transform="translate(575, 205) scale(0.4)" d="M 0,-40 C 0,-8 8,0 40,0 C 8,0 0,8 0,40 C 0,8 -8,0 -40,0 C -8,0 0,-8 0,-40 Z"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#7B5EE8" fill-opacity="0.25" stroke="#7B5EE8" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ GOOGLE FRONTIER 2026 ★
    </text>
  </g>

  <!-- Center-Bottom Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-150" y="-14" width="300" height="28" rx="14" fill="#0c1b3d" stroke="#4E82EE" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ☁️ 5TB GOOGLE ONE • DEEP REASONING
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    GEMINI 4 ARGON &amp; 3.8 FLASH
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#9C59EB" text-anchor="middle" letter-spacing="2">
    GEMINI ADVANCED 18 THÁNG • WORKSPACE AI • CHÍNH CHỦ
  </text>
</svg>
