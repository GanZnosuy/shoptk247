<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgYT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050303"/>
      <stop offset="50%" stop-color="#140404"/>
      <stop offset="100%" stop-color="#080202"/>
    </linearGradient>
    <linearGradient id="ytRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0000"/>
      <stop offset="100%" stop-color="#C20000"/>
    </linearGradient>
    <radialGradient id="ytGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#140404" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050303" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgYT)"/>
  <circle cx="400" cy="165" r="280" fill="url(#ytGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Official YouTube Play Button Emblem -->
  <g transform="translate(400, 155) scale(1.25)">
    <rect x="-65" y="-45" width="130" height="90" rx="26" fill="url(#ytRed)" filter="drop-shadow(0 0 25px rgba(255,0,0,0.6))"/>
    <path d="M -65,-25 C -65,-45 -45,-45 -25,-45 L 25,-45 C 45,-45 65,-45 65,-25 C 65,-30 45,-38 25,-38 L -25,-38 C -45,-38 -65,-30 -65,-25 Z" fill="#ffffff" opacity="0.15"/>
    <polygon points="-12,-24 24,0 -12,24" fill="#ffffff"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#FF0000" fill-opacity="0.25" stroke="#FF0000" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ ADD FAMILY CHÍNH CHỦ ★
    </text>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#290505" stroke="#FF0000" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      🎵 YOUTUBE MUSIC &amp; 1080p ENHANCED
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    YOUTUBE PREMIUM &amp; MUSIC
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FF4E45" text-anchor="middle" letter-spacing="2">
    CHÍNH CHỦ • KHÔNG QUẢNG CÁO • CHẠY NỀN TẮT MÀN HÌNH
  </text>
</svg>
