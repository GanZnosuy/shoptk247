<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgSec" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02050e"/>
      <stop offset="50%" stop-color="#061224"/>
      <stop offset="100%" stop-color="#020914"/>
    </linearGradient>
    <linearGradient id="secCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <radialGradient id="secGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#061224" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#02050e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgSec)"/>
  <circle cx="400" cy="165" r="280" fill="url(#secGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Cyber Hexagonal Shield & Binary Radar -->
  <g transform="translate(400, 155) scale(1.15)">
    <path d="M 0,-68 L 58,-40 L 58,22 C 58,56 32,78 0,90 C -32,78 -58,56 -58,22 L -58,-40 Z" fill="#071930" stroke="url(#secCyan)" stroke-width="3" filter="drop-shadow(0 0 25px rgba(0,240,255,0.55))"/>
    <circle cx="0" cy="12" r="30" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6"/>
    <circle cx="0" cy="12" r="16" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4"/>
    <line x1="-38" y1="12" x2="38" y2="12" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>
    <line x1="0" y1="-26" x2="0" y2="50" stroke="#00F0FF" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="12" r="5" fill="#ffffff" filter="drop-shadow(0 0 8px #00F0FF)"/>
    <polygon points="0,-45 10,-32 -10,-32" fill="#00F0FF"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#0072FF" fill-opacity="0.25" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ SECURITY AUDIT SUITE ★
    </text>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#07223d" stroke="#00F0FF" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      🛡️ SBOM AUDITOR • CVE 2026 • APK PENTEST
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    BỘ CÔNG CỤ BẢO MẬT &amp; REVERSE
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="2">
    BINARY IDENTIFIER • KIỂM THỬ LỖ HỔNG • DỊCH NGƯỢC CODE
  </text>
</svg>
