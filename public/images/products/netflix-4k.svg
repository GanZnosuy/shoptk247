<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020202"/>
      <stop offset="50%" stop-color="#140204"/>
      <stop offset="100%" stop-color="#050102"/>
    </linearGradient>
    <linearGradient id="netRedRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B80710"/>
    </linearGradient>
    <radialGradient id="netGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#140204" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020202" stop-opacity="0"/>
    </radialGradient>
    <filter id="netShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-4" dy="0" stdDeviation="6" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgNet)"/>
  <circle cx="400" cy="165" r="280" fill="url(#netGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Iconic Netflix 3D 'N' Ribbon Emblem -->
  <g transform="translate(400, 155) scale(1.15)">
    <path d="M -44,-85 L -16,-85 L -16,85 C -25,83 -35,83 -44,85 Z" fill="#B20710"/>
    <path d="M 16,-85 L 44,-85 L 44,85 C 35,83 25,83 16,85 Z" fill="#E50914"/>
    <path d="M -44,-85 L -16,-85 L 44,85 C 35,83 25,83 16,85 L -44,-85 Z" fill="url(#netRedRibbon)" filter="url(#netShadow)"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#E50914" fill-opacity="0.25" stroke="#E50914" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ ORIGINAL MASTER 4K ★
    </text>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#240508" stroke="#E50914" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      🍿 DOLBY VISION &amp; ATMOS • SPATIAL AUDIO
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    NETFLIX PREMIUM 4K ULTRA HD
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E50914" text-anchor="middle" letter-spacing="2">
    PROFILE RIÊNG • KHÓA MÃ PIN • XEM 4 THIẾT BỊ • FULL BẢO HÀNH
  </text>
</svg>
