<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgCanva" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030812"/>
      <stop offset="50%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#140624"/>
    </linearGradient>
    <linearGradient id="canvaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4CC"/>
      <stop offset="45%" stop-color="#3665EA"/>
      <stop offset="100%" stop-color="#7D2AE8"/>
    </linearGradient>
    <radialGradient id="canvaGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#7D2AE8" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#0a1228" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030812" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgCanva)"/>
  <circle cx="400" cy="165" r="280" fill="url(#canvaGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Canva Gradient Circle & Script 'C' -->
  <g transform="translate(400, 155) scale(1.15)">
    <circle cx="0" cy="0" r="68" fill="url(#canvaGradient)" filter="drop-shadow(0 0 30px rgba(125,42,232,0.65))"/>
    <path d="M 24,-28 C 15,-38 -2,-42 -18,-33 C -38,-23 -44,0 -38,20 C -31,41 -8,47 11,39 C 23,34 29,26 32,20 C 34,16 31,13 26,13 C 23,13 21,15 18,18 C 3,26 -13,20 -18,5 C -23,-9 -17,-25 -1,-27 C 9,-28 17,-22 20,-16 C 22,-12 25,-12 28,-14 C 32,-16 30,-21 24,-28 Z" fill="#ffffff"/>
    
    <!-- Pro Gold Crown -->
    <g transform="translate(42, -42) scale(0.85)">
      <polygon points="-16,8 -14,-10 -5,0 0,-14 5,0 14,-10 16,8" fill="#FFD700" filter="drop-shadow(0 0 6px rgba(255,215,0,0.8))"/>
      <circle cx="-14" cy="-10" r="2.5" fill="#ffffff"/>
      <circle cx="0" cy="-14" r="3" fill="#ffffff"/>
      <circle cx="14" cy="-10" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#00C4CC" fill-opacity="0.25" stroke="#00C4CC" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ MAGIC STUDIO &amp; BRAND KIT ★
    </text>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#140a33" stroke="#00C4CC" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ✨ CANVA MAGIC STUDIO™ AI • 100M+ MẪU
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    CANVA PRO &amp; EDU BẢN QUYỀN
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#00C4CC" text-anchor="middle" letter-spacing="2">
    NÂNG CHÍNH CHỦ • TÁCH NỀN 1 CHẠM • ĐỔI CỠ MA THUẬT
  </text>
</svg>
