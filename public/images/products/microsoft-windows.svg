<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgMS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020612"/>
      <stop offset="50%" stop-color="#061226"/>
      <stop offset="100%" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="fluentBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4FF"/>
      <stop offset="100%" stop-color="#0078D4"/>
    </linearGradient>
    <linearGradient id="fluentBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#004E8C"/>
    </linearGradient>
    <linearGradient id="copilotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3665EA"/>
      <stop offset="50%" stop-color="#DE4396"/>
      <stop offset="100%" stop-color="#FFB900"/>
    </linearGradient>
    <radialGradient id="winGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#0078D4" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#061226" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#020612" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgMS)"/>
  <circle cx="400" cy="165" r="280" fill="url(#winGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Windows 11 Fluent 4-Pane Logo -->
  <g transform="translate(400, 155) scale(1.15)">
    <rect x="-56" y="-56" width="52" height="52" rx="4" fill="url(#fluentBlue1)" filter="drop-shadow(0 0 20px rgba(0,120,212,0.6))"/>
    <rect x="4" y="-56" width="52" height="52" rx="4" fill="url(#fluentBlue1)"/>
    <rect x="-56" y="4" width="52" height="52" rx="4" fill="url(#fluentBlue2)"/>
    <rect x="4" y="4" width="52" height="52" rx="4" fill="url(#fluentBlue2)"/>

    <!-- Copilot AI Infinity Sparkle Ribbon -->
    <g transform="translate(46, -46) scale(0.6)">
      <path d="M 0,-25 C 15,-25 25,-15 25,0 C 25,15 15,25 0,25 C -15,25 -25,15 -25,0 C -25,-15 -15,-25 0,-25 Z" fill="none" stroke="url(#copilotGrad)" stroke-width="6" filter="drop-shadow(0 0 10px rgba(222,67,150,0.8))"/>
      <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#0078D4" fill-opacity="0.25" stroke="#00C4FF" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ MICROSOFT GENUINE LICENSE ★
    </text>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-150" y="-14" width="300" height="28" rx="14" fill="#061d3b" stroke="#00C4FF" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      ⚡ COPILOT PRO AI • 1TB ONEDRIVE
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    WINDOWS 11 PRO &amp; MICROSOFT 365
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#00C4FF" text-anchor="middle" letter-spacing="1.5">
    WINDOWS 11 PRO 24H2/25H2 • M365 BUILD 2609 • KEY 20 NĂM VĨNH VIỄN
  </text>
</svg>
