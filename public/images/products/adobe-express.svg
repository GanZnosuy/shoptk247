<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgAdobe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050204"/>
      <stop offset="50%" stop-color="#170308"/>
      <stop offset="100%" stop-color="#080104"/>
    </linearGradient>
    <linearGradient id="adobeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA0F00"/>
      <stop offset="100%" stop-color="#D0021B"/>
    </linearGradient>
    <radialGradient id="adobeGlow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FA0F00" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#170308" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#050204" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgAdobe)"/>
  <circle cx="400" cy="165" r="280" fill="url(#adobeGlow)"/>

  <!-- High-tech backdrop grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Official Adobe Emblem -->
  <g transform="translate(400, 155) scale(1.15)">
    <rect x="-62" y="-62" width="124" height="124" rx="26" fill="url(#adobeRed)" filter="drop-shadow(0 0 25px rgba(250,15,0,0.6))"/>
    <polygon points="-38,40 -8,-40 -38,-40" fill="#ffffff"/>
    <polygon points="38,40 8,-40 38,-40" fill="#ffffff"/>
    <polygon points="0,-12 20,40 -20,40" fill="#ffffff"/>

    <!-- Firefly AI Sparkle Indicator -->
    <g transform="translate(48, -48) scale(0.65)">
      <circle cx="0" cy="0" r="16" fill="#170308" stroke="#FF1361" stroke-width="2"/>
      <path d="M 0,-12 C 0,-3 3,0 12,0 C 3,0 0,3 0,12 C 0,3 -3,0 -12,0 C -3,0 0,-3 0,-12 Z" fill="#FFF800"/>
    </g>
  </g>

  <!-- Top Badge -->
  <g transform="translate(295, 26)">
    <rect width="210" height="30" rx="15" fill="#FA0F00" fill-opacity="0.25" stroke="#FA0F00" stroke-width="1.5"/>
    <text x="105" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      ★ 2026 CREATIVE SUITE v6.11 ★
    </text>
  </g>

  <!-- Spec Pill -->
  <g transform="translate(400, 268)" opacity="0.95">
    <rect x="-150" y="-14" width="300" height="28" rx="14" fill="#2b030b" stroke="#FA0F00" stroke-width="1.5"/>
    <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      🔥 ADOBE FIREFLY 2026 • 100GB CLOUD
    </text>
  </g>

  <!-- Title Text -->
  <text x="400" y="336" font-family="system-ui, sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
    ADOBE CREATIVE CLOUD 2026
  </text>
  <text x="400" y="365" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#FF4E45" text-anchor="middle" letter-spacing="1.5">
    PHOTOSHOP 2026 • PREMIERE PRO • ACROBAT STUDIO • EXPRESS 12T
  </text>
</svg>
